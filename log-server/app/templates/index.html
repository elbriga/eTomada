<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>eTomada Logs</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f5f7;
        color: #222;
      }

      header {
        background: #1f2937;
        color: white;
        padding: 18px 24px;
      }

      header h1 {
        margin: 0;
        font-size: 22px;
      }

      .filters {
        background: white;
        padding: 16px 24px;
        border-bottom: 1px solid #ddd;

        display: flex;
        gap: 10px;
        align-items: end;
        flex-wrap: wrap;
      }

      .filter {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .filter label {
        font-size: 12px;
        color: #666;
      }

      select,
      input,
      button {
        height: 36px;
        padding: 0 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: white;
      }

      input {
        min-width: 240px;
      }

      button {
        cursor: pointer;
        background: #2563eb;
        color: white;
        border: none;
        padding: 0 18px;
      }

      button:hover {
        background: #1d4ed8;
      }

      .status {
        margin-left: auto;
        color: #666;
        font-size: 13px;
      }

      .table-container {
        padding: 20px 24px;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        font-size: 13px;
      }

      th {
        background: #e5e7eb;
        text-align: left;
        padding: 10px;
        position: sticky;
        top: 0;
      }

      td {
        padding: 8px 10px;
        border-bottom: 1px solid #eee;
        vertical-align: top;
      }

      tr:hover {
        background: #f8fafc;
      }

      .timestamp {
        white-space: nowrap;
        color: #555;
      }

      .device {
        white-space: nowrap;
        font-weight: bold;
      }

      .level {
        font-weight: bold;
        white-space: nowrap;
      }

      .module {
        font-style: italic;
        white-space: nowrap;
      }

      .message {
        white-space: pre-wrap;
        font-family: monospace;
      }

      .log-crit {
        color: #dc2626;
      }
      .log-aviso {
        color: #d97706;
      }
      .log-normal {
        color: #39b706;
      }
      .log-debug0 {
        color: #9b9280;
      }
      .log-debug {
        color: #6b7280;
      }
      .log-teste {
        color: #3b62e0;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>eTomada Logs</h1>
    </header>

    <div class="filters">
      <div class="filter">
        <label>Nodo</label>

        <select id="device">
          <option value="">Todos</option>
        </select>
      </div>

      <div class="filter">
        <label>Nível</label>

        <select id="level">
          <option value="">Todos</option>
          <option value="!CRIT!">CRITICO</option>
          <option value="AVISO!">AVISO</option>
          <option value="NORMAL">NORMAL</option>
          <option value="DEBUG0">DEBUG0</option>
          <option value="DEBUG!">DEBUG</option>
          <option value="TESTE!">TESTE</option>
        </select>
      </div>

      <div class="filter">
        <label>Módulo</label>

        <input id="module" type="text" placeholder="ex: regras" />
      </div>

      <div class="filter">
        <label>Mensagem</label>

        <input id="search" type="text" placeholder="Pesquisar..." />
      </div>

      <button onclick="carregarLogs()">Atualizar</button>

      <div class="status" id="status">-</div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Data/Hora</th>
            <th>Nodo</th>
            <th>Nível</th>
            <th>Módulo</th>
            <th>Uptime</th>
            <th>Mensagem</th>
          </tr>
        </thead>

        <tbody id="logs"></tbody>
      </table>
    </div>

    <script>
      async function carregarNodos() {
        const response = await fetch("/api/nodes");

        const nodes = await response.json();

        const select = document.getElementById("device");

        const valorAtual = select.value;

        select.innerHTML = '<option value="">Todos</option>';

        for (const node of nodes) {
          const option = document.createElement("option");

          option.value = node.device_id;

          option.textContent = node.device_id;

          select.appendChild(option);
        }

        select.value = valorAtual;
      }

      async function carregarLogs() {
        const device = document.getElementById("device").value;

        const level = document.getElementById("level").value;

        const module = document.getElementById("module").value;

        const search = document.getElementById("search").value;

        const params = new URLSearchParams();

        if (device) params.set("deviceID", device);

        if (level) params.set("level", level);

        if (module) params.set("module", module);

        if (search) params.set("search", search);

        const response = await fetch("/api/logs?" + params.toString());

        const logs = await response.json();

        const tbody = document.getElementById("logs");

        tbody.innerHTML = "";

        for (const log of logs) {
          const tr = document.createElement("tr");

          const levelClass =
            "log-" + log.level.toLowerCase().replaceAll("!", "");

          tr.innerHTML = `
            <td class="timestamp">
                ${formataData(escapeHtml(log.timestamp))}
            </td>

            <td class="device">
                ${escapeHtml(log.device_id)}
            </td>

            <td class="level ${levelClass}">
                ${escapeHtml(log.level)}
            </td>

            <td class="module">
                ${escapeHtml(log.module || "")}
            </td>

            <td>
                ${formatUptime(log.uptime)}
            </td>

            <td class="message">
                ${escapeHtml(log.message)}
            </td>
        `;

          tbody.appendChild(tr);
        }

        document.getElementById("status").textContent = `${logs.length} logs`;
      }

      function formataData(ts) {
        const data = new Date(ts * 1000);
        return data.toLocaleString("pt-BR");
      }

      function formatUptime(seconds) {
        if (seconds === null || seconds === undefined) return "";

        let s = seconds;

        const days = Math.floor(s / 86400);

        s %= 86400;

        const hours = Math.floor(s / 3600);

        s %= 3600;

        const minutes = Math.floor(s / 60);

        s %= 60;

        if (days > 0) {
          return (
            `${days}d ` +
            `${String(hours).padStart(2, "0")}:` +
            `${String(minutes).padStart(2, "0")}:` +
            `${String(s).padStart(2, "0")}`
          );
        }

        return (
          `${String(hours).padStart(2, "0")}:` +
          `${String(minutes).padStart(2, "0")}:` +
          `${String(s).padStart(2, "0")}`
        );
      }

      function escapeHtml(value) {
        const div = document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;
      }

      carregarNodos();
      carregarLogs();
    </script>
  </body>
</html>
