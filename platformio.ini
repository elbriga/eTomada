[env:tela]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board = lilygo-t-display
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B31012579-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B31012579-if00
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions-16MB.csv
board_build.filesystem = littlefs
build_flags = 
    -D HW_TELA
    -D ASYNCWEBSERVER_REGEX
    -D TELA_COLORIDA
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TOUCH_CS=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
lib_deps =
    arduino-libraries/NTPClient@^3.2.1
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson
    adafruit/Adafruit AHTX0
    claws/BH1750
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit NeoPixel
    bodmer/TFT_eSPI @ ^2.5.34

[env:esp32s3]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board = esp32-s3-devkitc-1
upload_port = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
monitor_port = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A5069RR4-if00-port0
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi ; Habilita Flash Quad e PSRAM Octal
