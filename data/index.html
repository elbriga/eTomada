<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>eTomada</title>
    <link rel="stylesheet" href="style.css" />
    <script src="js/eTomada.js"></script>
    <script src="js/api.js"></script>
    <script src="js/reles.js"></script>
    <script src="js/sensores.js"></script>
    <script src="js/config.js"></script>
    <script src="js/util.js"></script>
    <script>
      window.addEventListener("load", eTomadaInit);
    </script>
  </head>

  <body>
    <header>
      <div class="headerTop">
        <div>
          ⚡ eTomada <br />
          <div id="status"></div>
          <button onclick="eTomadaRender()" style="width: 120px">
            🔄 Reload
          </button>
        </div>
        <button class="configBtn" onclick="openConfig()">⚙️</button>
      </div>
    </header>

    <div class="container" id="sensores"></div>

    <div class="container" id="reles"></div>

    <footer>
      <div id="datahora">--</div>
    </footer>

    <div id="configOverlay" class="overlay" onclick="closeConfig()"></div>
    <div id="configPanel" class="sidePanel">
      <div class="sideHeader">
        <div>⚙️</div>
        <button onclick="closeConfig()">✖</button>
      </div>
      <div id="configContent"></div>
      <br />
      <button onclick="salvarConfigGeral()">💾 Salvar Configuração</button>
    </div>

    <div id="modalOverlay" class="overlay" onclick="editModalClose()"></div>
    <div id="editModal" class="modal">
      <div class="modalHeader">
        <div id="modalTitle">Editar</div>
        <button onclick="editModalClose()">✖</button>
      </div>

      <div class="modalContent">
        <label>Nome</label>
        <input id="modalNome" maxlength="31" />
        <div id="modalDivRegra">
          <label>Regra</label>
          <span>
            Ação:
            <select id="modalRegraAcao" onchange="releOCModalAcao()">
              <option value="">Manual</option>
              <option value="ON">Ligado</option>
              <option value="OF">Desligado</option>
              <option value="SE">Condicional</option>
            </select>
          </span>
          <br /><br />
          <div id="divRegraHorario">
            Faixa de Horário:
            <input id="modalHorario" maxlength="11" placeholder="08:00-18:00" />
          </div>
          <div id="divRegraCondicional">
            Ligar SE:
            <input id="modalCondTrue" maxlength="5" placeholder="S1>10" />
            Desligar SE:
            <input id="modalCondFalse" maxlength="5" placeholder="S1<5" />
          </div>
          <input id="modalRegra" type="hidden" />
        </div>
        <br /><br />
        <button id="modalSalvarBtn">💾 Salvar</button>
      </div>
    </div>
  </body>
</html>
