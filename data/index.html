<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>eTomada</title>
    <link rel="stylesheet" href="style.css" />
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/reles.js"></script>
    <script src="js/sensores.js"></script>
    <script src="js/config.js"></script>
    <script src="js/util.js"></script>
    <script>
      window.addEventListener("load", init);
    </script>
  </head>

  <body>
    <header>
      <div class="headerTop">
        <div>
          ⚡ eTomada <br />
          <div id="status"></div>
          <button onclick="load()" style="width: 120px">🔄 Reload</button>
        </div>
        <button class="configBtn" onclick="openConfig()">⚙️</button>
      </div>
    </header>

    <div class="container" id="sensores"></div>

    <div class="container" id="reles"></div>

    <footer>
      <div id="datahora">--</div>
    </footer>

    <div id="configOverlay" class="overlay" onclick="closeConfig()"></div>
    <div id="configPanel" class="sidePanel">
      <div class="sideHeader">
        <div>⚙️</div>
        <button onclick="closeConfig()">✖</button>
      </div>
      <div id="configContent"></div>
      <br />
      <button onclick="salvarConfigGeral()">💾 Salvar Configuração</button>
    </div>

    <div id="modalOverlay" class="overlay" onclick="closeModal()"></div>
    <div id="editModal" class="modal">
      <div class="modalHeader">
        <div id="modalTitle">Editar</div>
        <button onclick="closeModal()">✖</button>
      </div>

      <div class="modalContent">
        <label>Nome</label>
        <input id="modalNome" maxlength="31" />
        <label>Regra</label>
        <input id="modalRegra" maxlength="31" placeholder="ON|08:00|18:00" />
        <br /><br />
        <button id="modalSalvarBtn">💾 Salvar</button>
      </div>
    </div>
  </body>
</html>
